<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Test wyceny druku 3D</title>
<style>
	body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
	h1 { font-size: 1.3rem; }
	label { display: block; margin-top: 0.9rem; font-weight: 600; font-size: 0.9rem; }
	input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
	details { margin-top: 1.2rem; border: 1px solid #ddd; border-radius: 6px; padding: 0.6rem 0.8rem; }
	summary { cursor: pointer; font-weight: 600; }
	button { margin-top: 1.2rem; padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
	pre { background: #f0f0f0; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
	.error { color: #c0392b; }
</style>
</head>
<body>
	<h1>Test lokalnej wyceny druku 3D</h1>
	<p>Wgraj plik .stl, wybierz ilość sztuk, opcjonalnie dopracuj szczegóły.</p>

	<form id="form">
		<label>Plik modelu (.stl)
			<input type="file" name="model" accept=".stl" required />
		</label>

		<label>Ilość sztuk
			<input type="number" name="quantity" value="1" min="1" max="100" />
		</label>

		<details>
			<summary>Zaawansowane</summary>

			<label>Materiał
				<select name="material" id="material"></select>
			</label>

			<label>Kolor
				<select name="color" id="color"></select>
			</label>

			<label>Wypełnienie (%)
				<input type="number" name="infill" id="infill" value="15" min="5" max="100" />
			</label>
		</details>

		<button type="submit">Policz wycenę</button>
	</form>

	<p id="status"></p>
	<pre id="result" hidden></pre>

	<script>
		const materialSelect = document.getElementById("material");
		const colorSelect = document.getElementById("color");
		const infillInput = document.getElementById("infill");

		fetch("/api/opcje")
			.then((r) => r.json())
			.then((opcje) => {
				for (const [key, label] of Object.entries(opcje.materialy)) {
					const opt = document.createElement("option");
					opt.value = key;
					opt.textContent = label;
					materialSelect.appendChild(opt);
				}
				for (const kolor of opcje.kolory) {
					const opt = document.createElement("option");
					opt.value = kolor;
					opt.textContent = kolor;
					colorSelect.appendChild(opt);
				}
				infillInput.value = opcje.wypelnienie.default;
				infillInput.min = opcje.wypelnienie.min;
				infillInput.max = opcje.wypelnienie.max;
			});

		const form = document.getElementById("form");
		const statusEl = document.getElementById("status");
		const resultEl = document.getElementById("result");

		form.addEventListener("submit", async (e) => {
			e.preventDefault();
			resultEl.hidden = true;
			statusEl.textContent = "Slicuję... (może potrwać do minuty)";
			statusEl.className = "";

			const formData = new FormData(form);
			try {
				const res = await fetch("/api/wycena", { method: "POST", body: formData });
				const data = await res.json();

				if (!res.ok) {
					throw new Error(data.error || "Nieznany błąd");
				}

				statusEl.textContent = "Gotowe.";
				resultEl.hidden = false;
				resultEl.textContent = JSON.stringify(data, null, 2);
			} catch (err) {
				statusEl.textContent = "Błąd: " + err.message;
				statusEl.className = "error";
			}
		});
	</script>
</body>
</html>
